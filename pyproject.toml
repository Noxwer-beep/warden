[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
version = "1.0.0"
description = "Homelab inventory, health checks and drift detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maximilian Jatzkowski" }]
keywords = ["homelab", "monitoring", "health", "inventory", "uptime"]
# TOML, SQLite and sockets are stdlib; rich draws every table, so it is required.
dependencies = ["rich>=13"]

[project.optional-dependencies]
ui = ["flask>=2.3"]

[project.scripts]
warden = "warden.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["warden", "warden.web"]

[tool.setuptools.package-data]
warden = ["web/templates/*.html", "web/static/*.css"]
