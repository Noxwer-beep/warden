[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
version = "1.0.0"
description = "Homelab inventory, health checks and drift detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maximilian Jatzkowski" }]
keywords = ["homelab", "monitoring", "health", "inventory", "uptime"]
# TOML is read with the stdlib; nothing else is required for the CLI.
dependencies = []

[project.optional-dependencies]
cli = ["rich>=13"]
ui = ["flask>=2.3"]

[project.scripts]
warden = "warden.cli:main"

[tool.setuptools]
packages = ["warden", "warden.web"]

[tool.setuptools.package-data]
warden = ["web/templates/*.html", "web/static/*.css"]
