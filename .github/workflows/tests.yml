name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite needs no dependencies: sockets, ssl and sqlite are stdlib, and
      # the prober tests bind their own servers on 127.0.0.1.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m compileall -q warden tests
      - name: Example inventory parses
        run: python -c "from warden import inventory; inventory.load('examples/warden.example.toml')"
